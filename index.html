<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .scene {
            width: 300px;
            height: 300px;
            perspective: 1000px;
            position: relative;
        }

        .heart-container {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            animation: rotate 10s infinite linear;
        }

        .text-item {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 11px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 5px #ff3366, 0 0 10px #ff3366;
            white-space: nowrap;
            transform-style: preserve-3d;
        }

        @keyframes rotate {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            }
        }

        .footer-name {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="heart-container" id="heart"></div>
    </div>

    <div class="footer-name">Ara Fa T</div>

    <script>
        const heartContainer = document.getElementById('heart');
        const totalItems = 250; 
        const text = "I Dread To You";

        for (let i = 0; i < totalItems; i++) {
            const item = document.createElement('div');
            item.className = 'text-item';
            item.innerText = text;

            // Parametric heart formula
            const t = (Math.PI * 2 * i) / totalItems;
            
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            const z = (Math.sin(t * 3) * 5);

            const scale = 8;

            item.style.transform = `translate3d(${x * scale}px, ${y * scale}px, ${z * scale}px) rotateY(${t}rad)`;

            heartContainer.appendChild(item);
        }
    </script>
</body>
</html>
